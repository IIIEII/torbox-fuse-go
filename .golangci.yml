version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign

  settings:
    errcheck:
      exclude-functions:
        # HTTP handlers — write errors are meaningless (client disconnected)
        - (net/http.ResponseWriter).Write
        # Defer patterns where errors are intentionally ignored
        - (io.Closer).Close
        - (database/sql.Tx).Rollback
        - (database/sql.Stmt).Close
        - fmt.Fprintf
        - fmt.Sscanf
        - os.Setenv

  exclusions:
    rules:
      # Relax errcheck and staticcheck in tests
      - path: (.+)_test\.go
        linters:
          - errcheck
          - staticcheck