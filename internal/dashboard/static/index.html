<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TorBox Media Center</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<div id="app">
		<header>
			<div class="header-row">
				<h1>TorBox Media Center</h1>
				<div class="connection-status">
					<span id="status-dot" class="status-dot connecting"></span>
					<span id="status-text">Connecting...</span>
				</div>
			</div>
			<div id="summary" class="summary"></div>
		</header>
		<main>
			<div class="filter-row">
				<input type="text" id="search" class="filter-input" placeholder="Filter files..." />
			</div>
			<section id="active-section">
				<div class="section-header">
					<h2>Active Files <span id="active-count" class="count"></span></h2>
				</div>
				<div id="active-files" class="file-list"></div>
			</section>
			<section id="cached-section">
				<div class="section-header">
					<h2>Cached <span id="cached-count" class="count"></span></h2>
				</div>
				<div id="cached-files" class="file-list"></div>
			</section>
			<section id="closed-section">
				<div class="section-header">
					<h2>Recently Closed <span id="closed-count" class="count"></span></h2>
				</div>
				<div id="closed-files" class="file-list"></div>
			</section>
		</main>
	</div>
	<script src="/app.js"></script>
</body>
</html>
