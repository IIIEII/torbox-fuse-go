name: E2E Tests

on:
  # Nightly at 04:00 UTC
  schedule:
    - cron: '0 4 * * *'
  # Manual trigger
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Enable FUSE device
        run: |
          sudo modprobe fuse || true
          sudo chmod 666 /dev/fuse || true

      - name: Run e2e tests
        run: make test